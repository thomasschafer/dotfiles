onboarding = false

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
pane_gaps = false

[ui.toast]
delivery = "system"

[workspace]
dynamic_naming = false

[keys]
prefix = "ctrl+a"

split_vertical = ["prefix+v", "prefix+|"]

next_tab = ["prefix+n", "ctrl+right"]
previous_tab = ["prefix+p", "ctrl+left"]

focus_pane_left = ["prefix+h", "ctrl+shift+left"]
focus_pane_right = ["prefix+l", "ctrl+shift+right"]

focus_pane_up = "prefix+shift+k"
focus_pane_down = ["prefix+k", "prefix+j"]

last_pane_in_tab = "prefix+;"
last_workspace = "prefix+shift+l"

# Re-pin the selected workspace's name/git status to its current directory
# (dynamic_naming is off above, so this is the only way to update them).
refresh_workspace_identity = "prefix+i"

next_workspace = "prefix+a"
previous_workspace = "prefix+shift+a"

next_agent = "prefix+)"
previous_agent = "prefix+("

copy_mode = ["prefix+[", "ctrl+b"]

[[keys.command]]
key = "prefix+F"
type = "plugin_action"
command = "thomasschafer.herdr-kiosk.open-picker"
description = "open repo picker"
