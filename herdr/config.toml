onboarding = false

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
pane_gaps = false
# # Inactive panes get a slightly lighter background
# # (catppuccin-macchiato default, slightly brightened).
# inactive_pane_bg = "#2d3049"

[ui.toast]
delivery = "system"

[workspace]
dynamic_naming = false

[session]
# Start these again, with the same arguments, when herdr restores a pane after
# a restart.
restore_commands = ["hx"]

[keys]
prefix = "ctrl+a"

# cmd chords reach herdr through the kitty keyboard protocol. Ghostty unbinds
# its own defaults for these (see ghostty/config.template) so it forwards them.

new_tab = "cmd+t"
previous_tab = ["cmd+ctrl+left", "cmd+ctrl+h"]
next_tab = ["cmd+ctrl+right", "cmd+ctrl+l"]

split_vertical = "cmd+d"
split_horizontal = "cmd+shift+d"
close_pane = "cmd+w"
zoom = "cmd+shift+enter"
last_pane_in_tab = "cmd+l"

focus_pane_left = ["cmd+shift+left", "cmd+shift+h"]
focus_pane_right = ["cmd+shift+right", "cmd+shift+l"]
focus_pane_up = ["cmd+shift+up", "cmd+shift+k"]
focus_pane_down = ["cmd+shift+down", "cmd+shift+j"]

next_workspace = "cmd+ctrl+j"
previous_workspace = "cmd+ctrl+k"
last_workspace = "cmd+comma"

next_agent = "cmd+j"
previous_agent = "cmd+k"

settings = "cmd+s"

# Re-pin the selected workspace's name/git status to its current directory
# (dynamic_naming is off above, so this is the only way to update them).
refresh_workspace_identity = "prefix+i"

copy_mode = ["prefix+[", "ctrl+b"]

[[keys.command]]
key = "cmd+p"
type = "plugin_action"
command = "thomasschafer.herdr-kiosk.open-picker"
description = "open repo picker"
