# macOS user defaults, keyed by defaults domain. modules/darwin.nix applies these through
# nix-darwin; machines without Nix can apply them with `defaults write`.
#
# The Dock's autohide setting varies between machines, so it's set per host instead.

["com.apple.dock"]
tilesize = 50
minimize-to-application = true
show-recents = false
static-only = true
expose-group-apps = true

["com.apple.screensaver"]
askForPassword = true
askForPasswordDelay = 0

["com.apple.screencapture"]
location = "~/Screenshots"

[NSGlobalDomain]
ApplePressAndHoldEnabled = false
InitialKeyRepeat = 15
KeyRepeat = 2
AppleInterfaceStyle = "Dark"
# Tab moves focus between all controls, not just text fields and lists.
AppleKeyboardUIMode = 2

["com.apple.menuextra.clock"]
ShowDayOfMonth = true
Show24Hour = true

[".GlobalPreferences"]
"com.apple.mouse.scaling" = 3.0

["com.apple.keyboard.lighting"]
KeyboardBrightness = 0

["com.apple.systemuiserver"]
menuExtras = [
  "/System/Library/CoreServices/Menu Extras/Battery.menu",
  "/System/Library/CoreServices/Menu Extras/Bluetooth.menu",
  "/System/Library/CoreServices/Menu Extras/Clock.menu",
  "/System/Library/CoreServices/Menu Extras/Volume.menu",
]

# Rex's appearance settings, which it keeps as defaults rather than in its config file.
["com.superlogical.rex"]
"Workspace.terminalFontName" = "JetBrainsMonoNL Nerd Font Mono"
"Workspace.terminalCursorStyle" = "block"
"Workspace.tabStyle" = "vertical"
"Workspace.sidebarPosition" = "left"
"Workspace.paneDensity" = "compact"
"Workspace.terminalOptionKeyBehavior" = "actsAsAlt"
# Lets the rex CLI ask the app to act, such as kiosk switching sessions and setup importing
# the theme.
"rex.client.remoteControl" = true
