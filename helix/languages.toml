# ----- Haskell -----
[language-server.haskell-language-server.config.haskell.plugin]
hlint.globalOn = false # https://github.com/haskell/haskell-language-server/issues/4674

[[language]]
name = "haskell"
auto-format = true
language-servers = ["haskell-language-server"]


# ----- Ruby -----
[language-server.sorbet]
command = "srb"
args = ["tc", "--lsp"]

[language-server.ruby-lsp]
command = "ruby-lsp"
args = []

[language-server.rubocop]
command = "bundle"
args = ["exec", "rubocop", "--lsp"]

[[language]]
name = "ruby"
language-servers = ["sorbet", "rubocop"]
auto-format = true


# ----- Toml -----
[[language]]
name = "toml"
auto-format = true


# ----- Rust -----
[language-server.rust-analyzer.config]
check.command = "clippy"
experimental = { testExplorer = true }
cargo.targetDir = true


# ----- Python -----
[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ruff.config.settings.lint]
select = ["E", "F", "I"] # Enable pycodestyle, pyflakes, and isort rules
preview = false

[[language]]
name = "python"
language-servers = ["ty", "ruff"]
auto-format = true

[language-server.ty]
command = "ty"
args = ["server"]


# ----- TypeScript + JavaScript -----
[[language]]
name = "typescript"
language-servers = ["typescript-language-server"]
auto-format = true
formatter = { command = "biome", args = ["format", "--stdin-file-path=file.ts"] }

[[language]]
name = "javascript"
language-servers = ["typescript-language-server"]
auto-format = true
formatter = { command = "biome", args = ["format", "--stdin-file-path=file.js"] }

[[language]]
name = "tsx"
language-servers = ["typescript-language-server"]
auto-format = true
formatter = { command = "biome", args = ["format", "--stdin-file-path=file.tsx"] }

[[language]]
name = "jsx"
language-servers = ["typescript-language-server"]
auto-format = true
formatter = { command = "biome", args = ["format", "--stdin-file-path=file.jsx"] }

# ----- Json -----
[[language]]
name = "json"
language-servers = ["vscode-json-language-server"]
auto-format = true
formatter = { command = "biome", args = [
  "format",
  "--config-path=${HOME_DIR}/.config/biome",
  "--json-formatter-indent-style=space",
  "--stdin-file-path=file.json",
] }

# ----- SQL -----
[[language]]
name = "sql"
formatter = { command = "pg_format", args = ["-i"] }
auto-format = true


# ----- Go -----
[[language]]
name = "go"
language-servers = ["gopls", "golangci-lint-lsp"]
auto-format = true

[language-server.golangci-lint-lsp.config]
command = [
  "golangci-lint",
  "run",
  "--output.json.path=stdout",
  "--show-stats=false",
  "--issues-exit-code=1",
]

# ----- Nix -----
[[language]]
name = "nix"
auto-format = true
formatter = { command = "nixfmt" }


# ----- Scheme -----
[[language]]
name = "scheme"
formatter = { command = "raco", args = ["fmt", "-i"] }
auto-format = true
language-servers = ["steel-language-server"]

[language-server.steel-language-server]
command = "steel-language-server"
args = []

